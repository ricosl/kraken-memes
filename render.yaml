# Render Blueprint for Kraken Breakout Intelligence.
#
# Deploy: dashboard.render.com -> New -> Blueprint -> select this repo.
# Render reads this file and proposes three resources below. See
# DEPLOYMENT.md for the full step-by-step guide, including which env vars
# you'll be prompted to fill in by hand (marked `sync: false` below — never
# committed to the repo).
#
# Cost note: the database and web service use Render's free plan. The cron
# job's plan/pricing is shown by Render at blueprint-apply time — each run
# is brief (a few seconds to ~1 minute), so cost should be minimal even if
# it isn't literally $0. See DEPLOYMENT.md for the paid-persistent-worker
# alternative if you'd rather avoid any usage-based charge.

databases:
  - name: kraken-memes-db
    databaseName: kraken_memes
    user: kraken_memes
    plan: free

services:
  # REST API for the PWA: markets, signals, alerts, paper trades, performance,
  # push subscriptions, settings. See apps/server.
  - type: web
    name: kraken-memes-server
    runtime: node
    plan: free
    buildCommand: npm install
    # Migrations + seed run on every server boot (see apps/server/src/index.ts)
    # rather than as a separate pre-deploy step — Render's free web services
    # don't support preDeployCommand.
    startCommand: npm run start -w apps/server
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: kraken-memes-db
          property: connectionString
      # Update this to your actual Netlify site URL after it's created (see
      # DEPLOYMENT.md) if you want to lock CORS down instead of leaving it open.
      - key: CORS_ORIGIN
        value: "*"
      # Generate with: npx web-push generate-vapid-keys
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        value: mailto:you@example.com
      - key: KRAKEN_REST_BASE_URL
        value: https://api.kraken.com
      - key: KRAKEN_WS_URL
        value: wss://ws.kraken.com/v2
      - key: KRAKEN_QUOTE_ASSET
        value: USD
      - key: SOCIAL_PROVIDER
        value: none
      # Freshness thresholds tuned for the 15-minute cron worker below, not
      # the sub-minute persistent daemon. If you switch to the persistent
      # worker (see DEPLOYMENT.md), remove these three to fall back to the
      # tighter defaults.
      - key: HEALTH_KRAKEN_CONNECTION_STALE_SECONDS
        value: "1800"
      - key: HEALTH_MARKET_DATA_STALE_SECONDS
        value: "1800"
      - key: HEALTH_SCAN_STALE_SECONDS
        value: "2100"

  # Free-tier monitoring: one full discovery -> ingest -> scan -> notify pass
  # every 15 minutes, then exits. See apps/worker/src/cron.ts and
  # DEPLOYMENT.md for the persistent-daemon alternative (apps/worker/src/index.ts).
  - type: cron
    name: kraken-memes-worker-cron
    runtime: node
    plan: starter
    schedule: "*/15 * * * *"
    buildCommand: npm install
    startCommand: npm run cron -w apps/worker
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: kraken-memes-db
          property: connectionString
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        value: mailto:you@example.com
      - key: KRAKEN_REST_BASE_URL
        value: https://api.kraken.com
      - key: KRAKEN_WS_URL
        value: wss://ws.kraken.com/v2
      - key: KRAKEN_QUOTE_ASSET
        value: USD
      - key: SOCIAL_PROVIDER
        value: none
      - key: WORKER_CRON_INTERVAL_MINUTES
        value: "15"
      - key: WORKER_CRON_TRADE_LOOKBACK_MINUTES
        value: "20"
